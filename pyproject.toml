[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "genomeos"
version = "0.1.0"
description = "Provenance-first atlas of human genetic variation"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # `<1`, restored. This was the original bound and the deliberate one: FastAPI has stayed on 0.x
  # for years, so the major-version guard belongs at 1 rather than at an arbitrary minor. #107
  # narrowed it to `<0.120` while adding an unrelated read preview, with no mention of fastapi in
  # its message or body — so 0.141.x was legal under the project's actual intent all along.
  # Verified: the API tests pass on 0.119.1 and on 0.141.1.
  "fastapi>=0.115,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
tabix = ["pysam>=0.23,<1"]
read = ["duckdb>=1.1", "h3>=4.1,<5"]
chat = ["google-auth[requests]>=2.40,<3", "httpx>=0.28,<1"]
# Atlas data foundation (P0/P1). Kept out of the default install so the Pan-UKB
# API container does not carry pyarrow/duckdb, which it never uses.
atlas = [
  # 0.33.1 changes four frozen schema exports without a GenomeOS schema change.
  "pandera[pandas]>=0.23,<0.33",
  "pandas>=2.2,<4",
  "pyarrow>=17",
  "duckdb>=1.1",
  "h3>=4.1,<5",
]
# Surface inference (P2). Separate from [atlas] because PyMC/PyTensor is a large
# dependency that only the offline fitting jobs need -- never the serving path (§5).
# Upper bounds are deliberate, not defensive boilerplate. `pymc>=5.16` alone resolved to 6.3.1,
# and PyMC changed how NUTS options are passed between 5.x and 6.x — enough for two contributors
# following the documented install to disagree about what the code does while both being right
# about their own environment. See `requirements.lock` and `scripts/env_report.py`.
surfaces = [
  # Some PyTensor/Numba versions admitted by this extra reach NumPy's row_stack alias, which
  # NumPy 2.5 removed. Keep the declared extras install on the verified side of that boundary.
  "numpy<2.5",
  "pymc>=5.16,<7",
  "arviz>=0.18,<2",
  # JAX-compiled NUTS. Not optional in practice: the spherical HSGP is ~80x faster through it
  # than through PyTensor, and it is the same code path that runs on a GPU.
  "numpyro>=0.15,<1",
]
# Raster handling for the population denominators (P3, §9). Offline batch only.
geo = [
  "rasterio>=1.3",
]
# Review figures. Not optional in practice on a remote runner: plot_surface imports matplotlib
# at module scope, so a missing extra is a crash rather than a degraded run — which is exactly
# how one pod died after the warning "does not provide the extra 'figures'" was dismissed as
# cosmetic two runs earlier.
figures = [
  "matplotlib>=3.8",
]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-cov>=6,<8", "pytest-xdist>=3.6,<4", "ruff>=0.6"]

[project.scripts]
genomeos = "genomeos.cli:main"

[tool.setuptools.packages.find]
include = ["genomeos*"]

[tool.setuptools.package-data]
genomeos = ["static/*.html", "covariates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in argument defaults is the canonical FastAPI idiom, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
