name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "genomeos/publication/**"
      - "scripts/encode_atlas_web.py"
      - "pyproject.toml"
      - "requirements.lock"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "genomeos/publication/**"
      - "scripts/encode_atlas_web.py"
      - "pyproject.toml"
      - "requirements.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Atlas web-object encoder
        run: python -m pip install -c requirements.lock '.[read]'
        working-directory: .
      - name: Encode Atlas web objects
        run: python scripts/encode_atlas_web.py
        working-directory: .
      - name: Refuse a catalog the encoder did not write
        run: git diff --exit-code website/public/data/atlas/catalog.json
        working-directory: .
      - name: Install exact dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Run unit and content contracts
        run: npm test
      - name: Build custom-domain site
        run: npm run build
      - name: Check custom-domain links
        run: npm run check:links -- dist /
      - name: Build GitHub project-site fallback
        run: npm run build:fallback
      - name: Check fallback links
        run: npm run check:links -- dist-fallback /genomeOS/

  # Browser and accessibility contracts, split by test across four runners that start alongside
  # validate. One worker per shard: software WebGL saturates a 4-vCPU runner (#411).
  # This job builds the site itself, so its steps before "Install browser runtime" must stay
  # identical to validate's steps before "Check formatting" (website/tests/pages-workflow.test.ts).
  e2e:
    name: e2e (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Atlas web-object encoder
        run: python -m pip install -c requirements.lock '.[read]'
        working-directory: .
      - name: Encode Atlas web objects
        run: python scripts/encode_atlas_web.py
        working-directory: .
      - name: Refuse a catalog the encoder did not write
        run: git diff --exit-code website/public/data/atlas/catalog.json
        working-directory: .
      - name: Install exact dependencies
        run: npm ci
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Run browser and accessibility contracts
        run: npm run test:e2e -- --fully-parallel --shard=${{ matrix.shard }}/${{ matrix.total }}
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: website/test-results
          retention-days: 7

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Atlas web-object encoder
        run: python -m pip install -c requirements.lock '.[read]'
      - name: Encode Atlas web objects
        run: python scripts/encode_atlas_web.py
      - name: Refuse a catalog the encoder did not write
        run: git diff --exit-code website/public/data/atlas/catalog.json
      - name: Install exact dependencies
        run: npm ci
        working-directory: website
      - name: Build production site
        run: npm run build
        working-directory: website
        env:
          CESIUM_TOKEN: ${{ secrets.CESIUM_TOKEN }}
          GOOGLE_MAPS_TOKEN: ${{ secrets.GOOGLE_MAPS_TOKEN }}
          # Google Analytics 4 (#422): only this build reports. Unset, the site loads no analytics.
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
      - name: Refuse broken production links
        run: npm run check:links -- dist /
        working-directory: website
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
